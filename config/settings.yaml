# Defaults for every tunable value. Environment variables override them:
#   SYNTHGEN_<GROUP>__<KEY>  e.g. SYNTHGEN_PATHS__DATA_DIR=/home/me/synthgen-data
#   LLM_PROVIDER, LLM_BASE_URL, LLM_MODEL, LLM_API_KEY, LLM_STUB_FIXTURES

llm:
  provider: stub                      # stub | openai_compatible
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key: null                       # from LLM_API_KEY only; never put a key here
  stub_fixtures: tests/fixtures/llm/skeleton
  temperature: 0.0
  planner_temperature: 0.3
  timeout_seconds: 60
  max_attempts: 5                     # HTTP retries on rate limits and server errors
  backoff_base_seconds: 1.0
  backoff_max_seconds: 30.0
  backoff_jitter: 0.5                 # share of each backoff drawn at random
  output_mode: json_schema            # json_schema (strict) | json_object | prompt (any server)
  max_tokens: null                    # cap on reply length; null = server default
  reasoning_effort: null              # low | medium | high for reasoning models; null = provider default
  requests_per_minute: 30             # client-side rate limiter

profiling:
  sample_size: 200000
  max_sample_cells: 20000000          # sample rows shrink so rows x columns stays under this
  max_select_columns: 1000            # result columns per SQL query (SQLite caps at 2,000)
  sample_seed: 0                      # profiles do not depend on the generation seed
  cache_max_age_days: 7
  histogram_bins: 50
  quantile_points: 1001
  percentiles: [1, 5, 10, 25, 50, 75, 90, 95, 99, 99.9]
  max_full_frequencies: 1000
  top_frequencies: 100
  rare_value_share: 0.001
  internal_min_count: 10
  shapiro_max_rows: 5000
  fit_sample_size: 2000               # values used for distribution fits, KDE and normality tests
  max_fit_columns: 200                # above this many numeric columns only closed-form fits run
  kde_points: 512
  zscore_limit: 3.0
  modified_z_limit: 3.5
  iqr_fence: 1.5
  round_bases: [1, 5, 10, 100, 1000]
  sentinel_dates: ["0001-01-01", "1900-01-01", "1970-01-01", "2099-12-31", "9999-12-31"]
  weekend_days: [5, 6]                # Monday = 0
  business_hours: [9, 17]             # start inclusive, end exclusive
  max_series_months: 120              # longer date ranges count rows per year instead
  min_series_days: 14                 # shortest daily series for trend and seasonality
  max_series_days: 3660               # longer ranges skip trend and seasonality
  max_pair_columns: 100               # columns entering pairwise statistics (F), by role and variance
  pair_sample_size: 20000             # rows used for pairwise statistics and rules
  max_pair_levels: 50                 # categorical columns with more levels skip association tests
  strong_association: 0.3             # |rho|, Cramer's V, correlation ratio or null Jaccard to keep a pair
  rule_min_share: 0.999               # share of rows a rule must hold on to be recorded
  max_arithmetic_columns: 30          # numeric columns searched for c = a + b and c = a * b
  max_conditional_levels: 10          # levels kept in conditional distributions
  max_parent_columns: 5               # parent date and category columns compared per relationship
  lag_quantile_points: 101            # quantiles kept of each child-after-parent date lag
  parent_sample_rows: 500             # parent rows sampled to find those columns
  behaviour_entities: 2000            # entities whose full histories feed behaviour statistics (H)
  behaviour_key_batch: 500            # entity keys per SQL query
  max_state_columns: 3                # categorical columns given a state-transition matrix
  max_label_columns: 2                # binary columns profiled as labels (I), rarest class first
  max_stratified_columns: 20          # most separating columns summarised per class
  separation_bins: 20                 # histogram bins for Jensen-Shannon on numbers and dates
  card_top_values: 5
  mapper_batch_tables: 15
  mapper_batch_columns: 250           # columns per semantic-mapper call; wider tables are sliced
  card_max_columns: 150               # wider tables get a summary card in planner prompts

generation:
  default_root_rows: 1000
  max_rows_per_table: 10000000
  chunk_rows: 250000
  max_cells_per_chunk: 20000000       # rows x columns per chunk; wide tables get shorter chunks
  dry_run_max_root_entities: 5000
  chunk_retries: 3
  text_pool_max_values: 500
  workers: 1
  semantic_pool_size: 5000            # fake values per semantic kind (names, emails, ...)
  faker_locale: en_US
  birth_dates: ["1940-01-01", "2008-12-31"]   # range of the date_of_birth semantic kind
  max_copula_columns: 50              # most columns one Gaussian copula covers (wide tables)
  copula_min_rho: 0.1                 # |Spearman| a column needs with another to join the copula
  max_sequence_events: 1000           # events per entity one scenario sequence may lay out
  order_min_share: 0.999              # share of profiled rows a child-after-parent date order needs

agent:
  caps:
    clarify: 2
    plan_rounds: 3
    planner_tool_calls: 8
    spec_repair: 3
    validation_repair: 3
    llm_reprompts: 3
  tool_result_max_tokens: 2000
  plan_expiry_days: 7

validation:
  ks_max: 0.10
  wasserstein_iqr_max: 0.10
  js_category_max: 0.10
  null_rate_diff_max: 0.02
  spearman_diff_max: 0.10
  js_temporal_max: 0.10
  ks_children_max: 0.10
  row_count_tolerance: 0.01
  scenario_share_rel_tolerance: 0.10
  signature_pass_min: 0.99
  scenario_ks_min: 0.30
  privacy_sample_size: 10000
  min_fidelity_rows: 1000             # PLAN Q6: smaller typical samples skip fidelity
  fidelity_sample_size: 200000        # typical rows per table the distribution checks read
  privacy_identifier_min_ratio: 0.5   # PLAN Q7: exact-match check on identifier-like columns
  privacy_lookup_batch: 500           # values per parameterised IN lookup in the source
  privacy_row_unique_min: 0.99        # row hashes gate only where source rows are this unique

seed:
  random_seed: 20261110               # fixed seed for the fake source databases
  scale: 1.0                          # row-count multiplier; tests use a small fraction

evaluation:
  golden_dir: tests/golden
  volumes: [100, 100000, 1000000]     # rows on each request's target table
  default_answer: "Use your best judgement and the most common reading of the request."
  max_pauses: 10                      # clarifications and approvals answered per job
  report_dir: eval                    # inside output_dir; one JSON report per run

paths:
  data_dir: data
  output_dir: output
  metadata_dir: config/metadata
  templates_dir: null                 # null = the built-in pack in synthgen/scenarios/templates
  state_db: state.db                  # inside data_dir
  checkpoints_db: checkpoints.db      # inside data_dir
